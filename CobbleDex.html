function battleHTML(types){const incoming=Object.keys(typeNames).map(t=>({type:t,mult:types.reduce((m,d)=>m*(attacks[t]?.[d]??1),1)}));const groups=[[4,'4× — Fraqueza extrema'],[2,'2× — Fraqueza'],[1,'1× — Dano neutro'],[.5,'½× — Resistência'],[.25,'¼× — Resistência forte'],[0,'0× — Imunidade']];const g=groups.map(([n,l])=>{let v=incoming.filter(x=>x.mult===n);return v.length?`<div class="minihead">${l}</div><div class="typegrid">${v.map(x=>`<div class="effect">${tag(x.type)}<b>${n}×</b></div>`).join('')}</div>`:''}).join('');const offensive=types.map(t=>`<div class="minihead">Golpes do tipo ${typeNames[t]}</div><div class="typegrid">${Object.keys(typeNames).filter(x=>(attacks[t]?.[x]??1)!==1).map(x=>`<div class="effect">${tag(x)}<b>${attacks[t]?.[x]??1}×</b></div>`).join('')}</div>`).join('');return `<b>DEFESA — DANO RECEBIDO</b>${g}<div class="minihead">ATAQUE — EFICÁCIA POR TIPO</div>${offensive}<p class="message">Cálculo apenas da tipagem; não considera habilidades, clima ou itens.</p>`}
function evoCondition(x){let d=x.evolution_details?.[0];if(!d)return 'Evolui';if(d.min_level)return `Nível ${d.min_level}`;if(d.item)return `Item: ${title(d.item.name)}`;if(d.held_item)return `Segurar: ${title(d.held_item.name)}`;if(d.min_happiness)return 'Amizade';if(d.time_of_day)return `Horário: ${d.time_of_day}`;if(d.trigger?.name==='trade')return 'Troca';return d.trigger?title(d.trigger.name):'Evolução'}
function evoNode(x){let id=Number(x.species.url.match(/\/(\d+)\/?$/)?.[1]||0);return `<div class="evoline"><div class="evo">${image(id)}<button data-pick="${id}">${escapeHTML(name(id))}</button><small>${num(id)}</small></div>${x.evolves_to?.length?`<div class="evobranch">${x.evolves_to.map(y=>`<div style="margin-bottom:8px"><small>↓ ${escapeHTML(evoCondition(y))}</small>${evoNode(y)}</div>`).join('')}</div>`:''}</div>`}
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(id){let seq=++loadSeq;render();$('status').textContent='Carregando ficha…';try{let d=cache.get(id),s=speciesCache.get(id);if(!d){let j=await json(`https://pokeapi.co/api/v2/pokemon/${id}/`);d={types:j.types.map(x=>x.type.name),stats:j.stats.map(x=>x.base_stat),height:j.height,weight:j.weight,abilities:j.abilities.map(x=>x.ability.name)};cache.set(id,d)}if(seq===loadSeq)render();if(!s){s=await json(`https://pokeapi.co/api/v2/pokemon-species/${id}/`);speciesCache.set(id,s)}if(s.evolution_chain?.url&&!chainCache.has(s.evolution_chain.url)){chainCache.set(s.evolution_chain.url,await json(s.evolution_chain.url))}if(seq===loadSeq){$('status').textContent='Ficha carregada';render()}}catch(e){if(seq===loadSeq){$('status').textContent='Sem conexão com os dados';render()}}}
async function loadCatalog(){try{const j=await json('https://pokeapi.co/api/v2/pokemon-species?limit=1025&offset=0');let k=0;for(const x of j.results){let id=Number(x.url.match(/\/(\d+)\/?$/)?.[1]);if(id>=1&&id<=N){nameMap.set(id,title(x.name));k++}}$('status').textContent=`${k} nomes carregados`;applyFilters();render()}catch(e){$('status').textContent='Modo parcial offline: conecte à internet para 1.025 nomes'}}
async function setType(t){type=t;if(!t||typeCache.has(t)){page=0;applyFilters();return}try{let j=await json(`https://pokeapi.co/api/v2/type/${t}/`);typeCache.set(t,new Set(j.pokemon.map(x=>Number(x.pokemon.url.match(/\/(\d+)\/?$/)?.[1])).filter(x=>x>=1&&x<=N)));page=0;applyFilters()}catch(e){type='';$('type').value='';$('status').textContent='Filtro por tipo requer internet'}}
for(const t of Object.keys(typeNames))$('type').insertAdjacentHTML('beforeend',`<option value="${t}">${typeNames[t]}</option>`);
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.pick){selected=+b.dataset.pick;showShiny=false;renderList();load(selected)}if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.view){view=b.dataset.view==='gen'||b.dataset.view==='types'?'all':b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.view==='gen')$('gen').focus();if(b.dataset.view==='types')$('type').focus();page=0;applyFilters()}if(b.id==='prev'&&page>0){page--;renderList()}if(b.id==='next'&&(page+1)*35<filtered.length){page++;renderList()}if(b.id==='capture'){caught.has(selected)?caught.delete(selected):caught.add(selected);save();applyFilters();render()}if(b.id==='favorite'){favorites.has(selected)?favorites.delete(selected):favorites.add(selected);save();applyFilters();render()}if(b.id==='toggleShiny'){showShiny=!showShiny;render()}if(b.id==='back'){selected=selected>1?selected-1:N;load(selected);renderList()}if(b.id==='forward'){selected=selected<N?selected+1:1;load(selected);renderList()}if(b.id==='backToList'){$('search').focus();if(innerWidth<781)$('search').scrollIntoView({behavior:'smooth'})}});
$('search').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();page=0;applyFilters()});$('gen').addEventListener('change',e=>{generation=+e.target.value;page=0;applyFilters()});$('type').addEventListener('change',e=>setType(e.target.value));$('heroImg').onerror=function(){this.style.opacity='.15'};$('shinyImg').onerror=function(){this.style.opacity='.15'};applyFilters();render();loadCatalog();load(selected);
})();
</script></body></html>
